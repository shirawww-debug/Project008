[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bfid"
version = "0.1.0"
description = "Reproduction pédagogique du sensing Wi-Fi par Beamforming Feedback Information (BFI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
ml = ["torch>=2.0"]
capture = ["scapy>=2.5"]
web = ["flask>=3.0", "matplotlib>=3.7"]
dev = ["pytest>=7.0", "flask>=3.0", "matplotlib>=3.7"]

[project.scripts]
bfid = "bfid.cli:main"

[tool.setuptools]
packages = ["bfid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
